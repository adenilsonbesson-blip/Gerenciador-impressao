name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Garante permissões de escrita para o runner
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true

          # Gera local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Pré-aprova todas as licenças do Android SDK
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || sudo mkdir -p "$ANDROID_HOME/licenses"
          sudo chown -R $USER:$USER "$ANDROID_HOME/licenses" 2>/dev/null || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "79124426920f4f13df3e5e52471a4f152ff041f9" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "601085b94cd77f0b54ff86406957099fed7926ce" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo "e9acab5b5fbb560a72cfa4eec63b3ce86aab9d16" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"

          # Aceita licenças e instala platforms;android-36 e build-tools
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            echo "Instalando plataforma Android SDK 36 e ferramentas..."
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Prepare Keystore and Environment
        run: |
          # Restaura debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Restaurando debug.keystore a partir de debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Gerando debug.keystore padrão..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Garante arquivos de segredos (.env e .env.example)
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=" > .env.example
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK with Gradle
        id: gradle_build
        run: |
          echo "Iniciando compilação do APK..."
          set +e
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace 2>&1 | tee build_output.log
          GRADLE_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $GRADLE_EXIT_CODE -ne 0 ]; then
            echo "============================================================"
            echo "::: PROMPT DE DIAGNÓSTICO DO ERRO DE COMPILAÇÃO :::"
            echo "============================================================"
            tail -n 60 build_output.log
            echo "============================================================"
            echo "### ❌ Falha na Compilação do APK" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 40 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $GRADLE_EXIT_CODE
          else
            echo "### ✅ Compilação do APK Concluída com Sucesso!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "APK gerado em: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoPrint-Hub-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release on GitHub (Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
